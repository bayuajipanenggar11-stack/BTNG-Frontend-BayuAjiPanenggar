<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0F0F0F" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#303030" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF5A1F" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#303030" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <line x1="50" y1="400" x2="750" y2="400" stroke="#252525" stroke-width="1" />
  <line x1="50" y1="400" x2="750" y2="400" stroke="url(#lineGrad)" stroke-width="2" />

  <!-- Car Silhouette -->
  <g transform="translate(140, 160)" stroke="#F2F0E9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Streamlined Body -->
    <path d="M 30 180 C 60 178, 90 145, 130 142 C 160 140, 190 90, 240 85 C 310 80, 360 85, 410 135 C 440 140, 480 155, 500 180" />
    <!-- Roof line & windows -->
    <path d="M 175 140 C 205 95, 240 90, 310 88 C 360 88, 395 115, 405 138 Z" fill="#202020" stroke="#A3A3A3" stroke-width="1.5" />
    <!-- Window divider -->
    <path d="M 285 90 L 280 138" stroke="#303030" stroke-width="2" />
    <!-- Wheel arches & wheels -->
    <circle cx="105" cy="180" r="32" fill="#151515" stroke="#404040" stroke-width="3" />
    <circle cx="105" cy="180" r="16" fill="#0C0C0C" stroke="#FF5A1F" stroke-width="2" />
    <circle cx="430" cy="180" r="32" fill="#151515" stroke="#404040" stroke-width="3" />
    <circle cx="430" cy="180" r="16" fill="#0C0C0C" stroke="#FF5A1F" stroke-width="2" />
    <!-- Chassis lower line -->
    <path d="M 137 185 L 398 185" stroke="#303030" stroke-width="3" />
    <!-- Headlight & Taillight accents -->
    <path d="M 32 175 L 50 176" stroke="#FF5A1F" stroke-width="3" />
    <path d="M 495 174 L 502 176" stroke="#EF4444" stroke-width="3" />
  </g>

  <!-- Typography -->
  <text x="400" y="440" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#A3A3A3" letter-spacing="4" text-anchor="middle">
    VELOCITY SHOWROOM ARCHIVE
  </text>
  <text x="400" y="465" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#666666" letter-spacing="1.5" text-anchor="middle">
    IMAGE PREVIEW CURRENTLY UNAVAILABLE
  </text>
</svg>
